<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex — Bonkers.</title>
  <meta name="description" content="A nostalgic Pokémon Pokédex + quiz, built by Júlia." />
  <link rel="icon" type="image/png" href="./src/assets/pokeball.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="src/css/reset.css" />
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="stylesheet" href="src/css/header.css" />
  <link rel="stylesheet" href="src/css/hero.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <!-- ===================== HEADER ===================== -->
  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-ball"></span>
      <span class="logo-text">Poké<span>dex</span></span>
    </a>

    <nav class="nav" id="nav">
      <a href="#pokedex">Pokédex</a>
      <a href="#history">History</a>
      <a href="#community">Community</a>
      <a href="/quiz.html" class="nav-cta">Quiz ⚡</a>
    </nav>

    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <!-- 3 painéis inspirados na referência: dia / tarde / noite -->
    <div class="hero-panel hero-panel--day"   aria-hidden="true"></div>
    <div class="hero-panel hero-panel--dusk"  aria-hidden="true"></div>
    <div class="hero-panel hero-panel--night" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="hero-tag">press start!</p>
      <h1 class="hero-title">
        Catch it if<br>
        <span class="accent">you can.</span>
      </h1>
      <p class="hero-sub">
        A nostalgic Pokédex search, you can also see if you really know about Pokémon.
      </p>
      <div class="hero-actions">
        <a href="#pokedex" class="btn btn-primary">Open Pokédex →</a>
        <a href="./quiz.html" class="btn btn-ghost">Who's that Pokémon?!</a>
      </div>
    </div>

    <div class="hero-scroll" aria-hidden="true">
      <span>scroll</span>
      <div class="hero-scroll-line"></div>
    </div>
  </section>

  <script src="src/js/script.js"></script>
</body>
</html>
